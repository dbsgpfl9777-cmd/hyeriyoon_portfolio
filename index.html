<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YOONHYERI — PORTFOLIO</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

  <div id="top"></div>

  <!-- ============ HOME (맨 위) ============ -->
  <div class="home-wrap">
    <div class="home-title">
      <div class="name">YOONHYERI</div>
      <div class="sub">PORTFOLIO</div>
    </div>

    <div class="reel-section">
      <div class="reel-head">
        <div class="label">DEMO REEL</div>
        <div class="num">01</div>
      </div>
      <div class="home-video" id="home-video"></div>
    </div>

    <nav class="home-nav">
      <a href="#about-section"><span>ABOUT ME</span></a>
      <a href="#portfolio-section"><span>PORTFOLIO</span></a>
      <a href="#experience-section"><span>EXPERIENCE</span></a>
    </nav>
  </div>

  <!-- ============ ABOUT / PORTFOLIO / EXPERIENCE (사이드바 + 이어지는 스크롤) ============ -->
  <div class="page">
    <div id="sidebar-mount"></div>

    <div class="content">

      <section class="content-section" id="about-section">
        <div class="content-header">
          <div class="content-title">ABOUT ME</div>
          <div class="content-meta" id="updated-date"></div>
        </div>
        <div class="about-grid" id="about-grid"></div>
      </section>

      <section class="content-section" id="portfolio-section">
        <div class="content-header">
          <div class="content-title">PORTFOLIO</div>
          <div class="content-meta" id="pf-counter"></div>
        </div>
        <div class="tabs" id="pf-tabs"></div>
        <div class="thumb-row" id="pf-thumb-row"></div>
        <div id="pf-detail"></div>
      </section>

      <section class="content-section" id="experience-section">
        <div class="content-header">
          <div class="content-title">EXPERIENCE</div>
          <div class="content-meta" id="exp-counter"></div>
        </div>
        <div class="tabs" id="exp-tabs"></div>
        <div id="exp-list"></div>
      </section>

    </div>
  </div>

<script src="assets/data.js"></script>
<script src="assets/common.js"></script>
<script>
  // ---- Home 데모 릴 영상 ----
  const DEMO_REEL_URL = ""; // 예: "https://www.youtube.com/watch?v=xxxxxxxxxxx"
  document.getElementById('home-video').innerHTML =
    renderVideoBox(DEMO_REEL_URL, 'STILL FRAME — 1920×1080');

  // ---- 사이드바 ----
  document.getElementById('sidebar-mount').outerHTML = renderSidebar(186);

  // ---- ABOUT ----
  (function() {
    const now = new Date();
    document.getElementById('updated-date').textContent =
      `UPDATED ${now.getFullYear()}.${String(now.getMonth() + 1).padStart(2, '0')}`;

    const profileHtml = `
      <div class="col-profile">
        <div class="field-row">
          <div class="field-label">NAME</div>
          <div class="field-value">${PROFILE.name}</div>
        </div>
        <div class="field-row">
          <div class="field-label">ROLE</div>
          <div class="field-value muted">${PROFILE.role}</div>
        </div>
        <div class="field-row">
          <div class="field-label">EMAIL</div>
          <div class="field-value muted"><a href="mailto:${PROFILE.email}">${PROFILE.email}</a></div>
        </div>
        <div class="field-row">
          <div class="field-label">EDUCATION</div>
          <div class="field-value muted">${PROFILE.education.join('<br>')}</div>
        </div>
        <div class="field-row">
          <div class="field-label">CERTIFICATION</div>
          <div class="field-value muted">
            ${PROFILE.certifications.map(c => `
              <div class="cert-row"><span>${c.name}</span><span>${c.year}</span></div>
            `).join('')}
          </div>
        </div>
      </div>`;

    const careerSkillsHtml = `
      <div class="col-career-skills">
        <div>
          <div class="block-title">CAREER</div>
          <div class="career-list">
            ${PROFILE.career.map(c => `
              <div class="career-row"><span>${c.name}</span><span>${c.duration}</span></div>
            `).join('')}
          </div>
        </div>
        <div class="skills-block">
          <div class="block-title">SKILLS</div>
          <div class="skill-tags">
            ${PROFILE.skills.map(s => `<span class="skill-tag">${s}</span>`).join('')}
          </div>
        </div>
      </div>`;

    const gamePlayHtml = `
      <div class="col-gameplay">
        <div class="gameplay-head">
          <div class="block-title">GAME PLAY</div>
          <div class="gameplay-count">${PROFILE.gamePlay.length}</div>
        </div>
        <div class="gameplay-list">
          ${PROFILE.gamePlay.map(g => `
            <div class="gameplay-row">
              <div class="gameplay-thumb"></div>
              <div>
                <div class="gameplay-title">${g.title}</div>
                <div class="gameplay-hours">${g.hours}</div>
              </div>
            </div>
          `).join('')}
        </div>
      </div>`;

    document.getElementById('about-grid').innerHTML =
      profileHtml + careerSkillsHtml + gamePlayHtml;
  })();

  // ---- PORTFOLIO ----
  (function() {
    let activeCategory = 'ALL';
    let activeIndex = 0;

    function filteredProjects() {
      if (activeCategory === 'ALL') return PORTFOLIO_PROJECTS;
      return PORTFOLIO_PROJECTS.filter(p => p.categories.includes(activeCategory));
    }

    function renderTabs() {
      const cats = ['ALL', ...PORTFOLIO_CATEGORIES];
      document.getElementById('pf-tabs').innerHTML = cats.map(cat => `
        <button data-cat="${cat}" class="${cat === activeCategory ? 'active' : ''}">${cat}</button>
      `).join('');
      document.querySelectorAll('#pf-tabs button').forEach(btn => {
        btn.addEventListener('click', () => {
          activeCategory = btn.dataset.cat;
          activeIndex = 0;
          renderAll();
        });
      });
    }

    function renderThumbs() {
      const list = filteredProjects();
      document.getElementById('pf-thumb-row').innerHTML = list.map((p, i) => `
        <button class="thumb-item ${i === activeIndex ? 'active' : ''}" data-i="${i}">
          <div class="thumb-box"></div>
          <div class="thumb-meta">
            <span class="thumb-num">${String(i + 1).padStart(2, '0')}</span>
            <span class="thumb-label">${p.title}</span>
          </div>
        </button>
      `).join('');
      document.querySelectorAll('#pf-thumb-row .thumb-item').forEach(btn => {
        btn.addEventListener('click', () => {
          activeIndex = Number(btn.dataset.i);
          renderDetail();
          renderThumbs();
        });
      });
    }

    function renderDetail() {
      const list = filteredProjects();
      document.getElementById('pf-counter').textContent =
        `${activeCategory} · ${list.length} ITEM${list.length !== 1 ? 'S' : ''}`;

      if (list.length === 0) {
        document.getElementById('pf-detail').innerHTML =
          `<div class="empty-state">아직 이 카테고리에 등록된 프로젝트가 없습니다.</div>`;
        return;
      }

      const p = list[activeIndex];

      document.getElementById('pf-detail').innerHTML = `
        <div class="detail-head">
          <div class="detail-title">${p.title}</div>
          <div class="detail-year">${p.year}</div>
        </div>
        <div class="detail-video">
          ${renderVideoBox(p.video, 'VIDEO NOT SET')}
        </div>
        <div class="detail-navrow">
          <button id="pf-prev-btn" ${activeIndex === 0 ? 'disabled' : ''}>← PREV</button>
          <div class="detail-position">${activeIndex + 1} / ${list.length}</div>
          <button id="pf-next-btn" ${activeIndex === list.length - 1 ? 'disabled' : ''}>NEXT →</button>
        </div>
        <div class="detail-body">
          <div>
            <div class="block-title" style="font:600 9.5px/1 'Public Sans',sans-serif;letter-spacing:.14em">DESIGN</div>
            ${p.design.map(d => `<div class="design-text">${d}</div>`).join('')}
          </div>
          <div class="tools-col">
            <div class="block-title" style="font:600 9.5px/1 'Public Sans',sans-serif;letter-spacing:.14em">TOOLS</div>
            <div class="tools-list">
              ${p.tools.map(t => `<div>${t}</div>`).join('')}
            </div>
          </div>
        </div>
      `;

      const prevBtn = document.getElementById('pf-prev-btn');
      const nextBtn = document.getElementById('pf-next-btn');
      if (prevBtn) prevBtn.addEventListener('click', () => {
        if (activeIndex > 0) { activeIndex--; renderDetail(); renderThumbs(); }
      });
      if (nextBtn) nextBtn.addEventListener('click', () => {
        if (activeIndex < list.length - 1) { activeIndex++; renderDetail(); renderThumbs(); }
      });
    }

    function renderAll() {
      renderTabs();
      renderThumbs();
      renderDetail();
    }

    renderAll();
  })();

  // ---- EXPERIENCE ----
  (function() {
    let activeCategory = 'ALL';

    function filteredItems() {
      if (activeCategory === 'ALL') return EXPERIENCE_ITEMS;
      return EXPERIENCE_ITEMS.filter(it => it.category === activeCategory);
    }

    function renderTabs() {
      const cats = ['ALL', ...EXPERIENCE_CATEGORIES];
      document.getElementById('exp-tabs').innerHTML = cats.map(cat => `
        <button data-cat="${cat}" class="${cat === activeCategory ? 'active' : ''}">${cat}</button>
      `).join('');
      document.querySelectorAll('#exp-tabs button').forEach(btn => {
        btn.addEventListener('click', () => {
          activeCategory = btn.dataset.cat;
          render();
        });
      });
    }

    function render() {
      renderTabs();

      const list = filteredItems();
      document.getElementById('exp-counter').textContent =
        `${activeCategory} · ${list.length} ITEM${list.length !== 1 ? 'S' : ''}`;

      if (list.length === 0) {
        document.getElementById('exp-list').innerHTML =
          `<div class="empty-state">아직 이 카테고리에 등록된 경력이 없습니다.</div>`;
        return;
      }

      document.getElementById('exp-list').innerHTML = list.map((it, i) => `
        <div class="exp-row" data-i="${i}">
          <button class="exp-head" data-toggle="${i}">
            <div class="exp-thumb"></div>
            <div class="exp-info">
              <div class="exp-toprow">
                <div class="exp-org">${it.org}</div>
                <div class="exp-year">${it.period}</div>
              </div>
              <div class="exp-subtitle">${it.subtitle}</div>
            </div>
            <div class="exp-chev">▾</div>
          </button>
          <div class="exp-panel">
            <div>
              <div class="exp-detail-text">${it.detail}</div>
              ${it.url ? `<a class="exp-link" href="${it.url}" target="_blank" rel="noreferrer">관련 링크 보기 →</a>` : ''}
            </div>
            <div class="exp-role-col">
              <div class="exp-role-label">ROLE</div>
              <div class="exp-role-list">
                ${it.roleDetail.join('<br>')}
              </div>
            </div>
          </div>
        </div>
      `).join('');

      document.querySelectorAll('[data-toggle]').forEach(btn => {
        btn.addEventListener('click', () => {
          const row = btn.closest('.exp-row');
          row.classList.toggle('open');
        });
      });
    }

    render();
  })();

  // ---- 스크롤 위치에 따라 사이드바 현재 위치 표시 ----
  initScrollSpy();
</script>
</body>
</html>
